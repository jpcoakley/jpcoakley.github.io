<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Family Tree — JP Coakley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=12">
<style>
  /* light theme for this page only */
  body {
    --paper: #FFFFFF;
    --ink: #1E2A3A;
    --blue: #385A8C;
    --red: #C82828;
    --muted: #8B8B85;
    --line: #DDDCD4;
    --panel: #F7F7F4;
  }

  /* ---------- gate ---------- */
  .gate {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    text-align: center;
  }
  .gate input {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font: inherit;
    letter-spacing: 0.08em;
    padding: 0.8rem 1.1rem;
    width: min(320px, 80vw);
    text-align: center;
  }
  .gate button, .zoombar button {
    background: none;
    border: 1px solid var(--blue);
    color: var(--blue);
    font: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 0.7rem 1.6rem;
    cursor: pointer;
  }
  .gate button:hover, .zoombar button:hover { border-color: var(--red); color: var(--red); }
  .gate .err { color: var(--red); font-size: 0.8rem; letter-spacing: 0.1em; min-height: 1.2em; }
  .pwwrap { position: relative; display: inline-block; }
  .pwwrap input { padding-right: 2.6rem; }
  #pweye {
    position: absolute; right: 0.5rem; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 0.2rem;
    display: flex; align-items: center;
  }
  #pweye.on { color: var(--blue); }

  /* ---------- viewport / canvas ---------- */
  .treeview {
    position: relative;
    overflow: hidden;
    height: calc(100vh - 220px);
    min-height: 480px;
    border: 1px solid var(--line);
    background:
      radial-gradient(circle at 50% 0%, rgba(56,90,140,0.04), transparent 60%);
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .treeview.grabbing { cursor: grabbing; }
  #canvas {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 0 0;
    display: block;
  }
  .zoombar {
    position: absolute;
    right: 1rem; bottom: 1rem;
    display: flex;
    gap: 0.5rem;
    z-index: 5;
  }
  .zoombar button { padding: 0.45rem 0.9rem; background: var(--paper); }

  /* ---------- tidy tree: absolute-positioned units + connectors ---------- */
  #wires { position: absolute; left: 0; top: 0; pointer-events: none; }
  .rowtag {
    position: absolute;
    left: 0.6rem;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--muted);
  }
  .unit {
    position: absolute;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 8px 1.5rem;
    border: 1px solid transparent;
    background: var(--paper);
  }
  .unit.expandable { border-color: var(--line); cursor: pointer; }
  .unit.expandable:hover { border-color: var(--blue); }
  .unit.open { border-color: var(--blue); background: rgba(56,90,140,0.05); }
  .expander {
    position: absolute;
    bottom: 0.25rem; left: 50%;
    transform: translateX(-50%);
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--blue);
    white-space: nowrap;
  }
  .unit.open .expander { color: var(--red); }

  /* ---------- person tile ---------- */
  .person {
    position: relative;
    width: 168px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 0.7rem;
    white-space: normal;
    flex: 0 0 auto;
  }
  .person .pic {
    width: 64px; height: 64px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 0.5rem;
    background: rgba(56,90,140,0.12);
    display: flex; align-items: center; justify-content: center;
    color: var(--blue);
    font-weight: 600; letter-spacing: 0.1em; font-size: 1rem;
  }
  .person .pic img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .person .pname {
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink); text-align: center;
    margin-bottom: 0.35rem;
  }
  .person .pinfo { font-size: 0.62rem; line-height: 1.5; color: var(--muted); text-align: center; word-break: break-word; }
  .person .pinfo a { color: var(--blue); text-decoration: none; }
  .pmenu-btn {
    position: absolute; top: 0.3rem; right: 0.45rem;
    background: none; border: none; color: var(--muted);
    font-size: 0.9rem; cursor: pointer; padding: 0.1rem 0.3rem;
  }
  .pmenu {
    position: absolute; top: 1.6rem; right: 0.4rem; z-index: 6;
    background: var(--paper); border: 1px solid var(--line);
    display: none; flex-direction: column; min-width: 130px;
  }
  .pmenu.open { display: flex; }
  .pmenu button {
    background: none; border: none; color: var(--ink);
    font: inherit; font-size: 0.62rem; letter-spacing: 0.14em;
    text-transform: uppercase; padding: 0.55rem 0.8rem;
    cursor: pointer; text-align: left;
  }
  .pmenu button:hover { color: var(--red); }

  /* inline contact editor */
  .pedit { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.3rem; }
  .pedit input {
    background: rgba(0,0,0,0.04);
    border: 1px solid var(--line);
    color: var(--ink);
    font: inherit; font-size: 0.62rem;
    padding: 0.3rem 0.4rem;
  }
  .pedit button {
    font: inherit; font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    padding: 0.35rem 0; cursor: pointer;
    background: none; border: 1px solid var(--blue); color: var(--blue);
  }
  .pedit button.pedit-cancel { border-color: var(--line); color: var(--muted); }
  .pedit button:hover { border-color: var(--red); color: var(--red); }
  .pedit-msg { font-size: 0.58rem; letter-spacing: 0.12em; color: var(--muted); min-height: 0.9em; }
</style>
</head>
<body>

<header>
  <a class="site-name" href="index.html">JP&nbsp;Coakley</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="photography.html">Photography</a>
    <a href="about.html">About Me</a>
  </nav>
</header>

<main>
  <h1 class="page-title wordmark" style="margin-top:2rem">Family Tree</h1>

  <section class="gate" id="gate">
    <p class="kicker">Descendants of John Aloysius Coakley</p>
    <span class="pwwrap">
      <input type="password" id="pw" placeholder="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" id="pweye" aria-label="Show password">
        <svg id="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/>
          <circle cx="12" cy="12" r="2.8"/>
        </svg>
        <svg id="eye-shut" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/>
          <circle cx="12" cy="12" r="2.8"/>
          <line x1="4" y1="20" x2="20" y2="4"/>
        </svg>
      </button>
    </span>
    <button id="unlock">Unlock</button>
    <p class="err" id="err"></p>
  </section>

  <section id="treewrap" style="display:none">
    <p class="kicker" style="margin-bottom:1rem">Drag to pan · scroll or pinch to zoom · click a family to expand · <a class="crumb" href="#" id="lockbtn">lock</a></p>
    <div class="treeview" id="viewport">
      <div id="canvas"></div>
      <div class="zoombar">
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zfit">Fit</button>
        <button id="zin" aria-label="Zoom in">+</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <span>JP Coakley</span>
  <a class="contact-link" href="mailto:jpcoakley@gmail.com">Contact</a>
</footer>

<input type="file" id="photopick" accept="image/*" style="display:none">

<script>
(function () {
  // WebCrypto (decryption) only exists on secure pages. Until jpcoakley.com
  // serves HTTPS, explain rather than fail with a wrong-password error.
  if (!(window.crypto && crypto.subtle)) {
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("gate").innerHTML =
        '<p class="kicker">Descendants of John Aloysius Coakley</p>' +
        '<p class="lede" style="text-align:center">The family tree needs a secure ' +
        "(https) connection, which this site doesn't have quite yet. Check back " +
        "soon — it's being worked on.</p>";
    });
    return;
  }
  var DATA_URL = "assets/familytree.enc";
  var data = null;

  /* ---------- decrypt (openssl enc -aes-256-cbc -pbkdf2 -iter 200000) ---------- */
  async function decrypt(b64, pass) {
    var raw = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var salt = raw.slice(8, 16), ct = raw.slice(16);
    var km = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    var bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
      km, 384));
    var key = await crypto.subtle.importKey(
      "raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }

  document.getElementById("pweye").addEventListener("click", function () {
    var pw = document.getElementById("pw");
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    this.classList.toggle("on", show);
    document.getElementById("eye-open").style.display = show ? "none" : "";
    document.getElementById("eye-shut").style.display = show ? "" : "none";
    pw.focus();
  });

  document.getElementById("unlock").addEventListener("click", unlock);
  document.getElementById("pw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") unlock();
  });

  var currentPass = null;
  var EDIT_FIELDS = ["birthday", "phone", "email", "addr1", "addr2"];

  async function tryUnlock(pass) {
    try {
      var b64 = await (await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })).text();
      data = await decrypt(b64.trim(), pass);
    } catch (e) {
      return false;
    }
    currentPass = pass;
    try { localStorage.setItem("ftpass", pass); } catch (_) {}
    // overlay live edits + added people from the API (absent on localhost)
    additions = {};
    try {
      additions = await (await fetch("/api/familytree/additions",
        { headers: { "X-FT-Pass": pass }, cache: "no-store" })).json();
    } catch (_) { additions = {}; }
    Object.keys(additions).forEach(function (pid) {
      var a = additions[pid];
      data.people[pid] = { id: pid, name: a.name, birthday: a.birthday || "",
        phone: a.phone || "", email: a.email || "",
        addr1: a.addr1 || "", addr2: a.addr2 || "" };
    });
    try {
      var ov = await (await fetch("/api/familytree/overrides",
        { headers: { "X-FT-Pass": pass }, cache: "no-store" })).json();
      Object.keys(ov).forEach(function (pid) {
        if (!data.people[pid]) return;
        EDIT_FIELDS.forEach(function (f) {
          if (typeof ov[pid][f] === "string") data.people[pid][f] = ov[pid][f];
        });
      });
    } catch (_) {}
    document.getElementById("gate").style.display = "none";
    document.getElementById("treewrap").style.display = "block";
    buildUnits();
    expanded.root = true;   // Jack starts open: his 9 kids' couples showing
    render();
    fit();
    return true;
  }

  async function unlock() {
    var err = document.getElementById("err");
    err.textContent = "";
    var ok = await tryUnlock(
      document.getElementById("pw").value.trim().toLowerCase());
    if (!ok) err.textContent = "That's not it — try again.";
  }

  // remembered unlock: skip the gate on devices that have entered it before
  var remembered = null;
  try { remembered = localStorage.getItem("ftpass"); } catch (_) {}
  if (remembered) {
    tryUnlock(remembered).then(function (ok) {
      if (!ok) { try { localStorage.removeItem("ftpass"); } catch (_) {} }
    });
  }

  document.getElementById("lockbtn").addEventListener("click", function (e) {
    e.preventDefault();
    try { localStorage.removeItem("ftpass"); } catch (_) {}
    location.reload();
  });

  /* ---------- render ---------- */
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  }

  function initials(name) {
    return name.split(/\s+/).slice(0, 2).map(function (w) { return w[0] || ""; }).join("");
  }

  function personTile(pid) {
    var p = data.people[pid];
    if (!p) return el("div");
    var t = el("div", "person");
    t.dataset.pid = pid;
    var pic = el("div", "pic", '<span>' + initials(p.name) + '</span><img alt="">');
    t.appendChild(pic);
    var img = pic.querySelector("img");
    var saved = localStorage.getItem("ftphoto:" + pid);
    if (saved === "hidden") { /* keep initials */ }
    else if (saved) { img.src = saved; img.style.display = "block"; pic.querySelector("span").style.display = "none"; }
    else if (data.photos && data.photos[pid]) {
      img.src = data.photos[pid];
      img.style.display = "block";
      pic.querySelector("span").style.display = "none";
    }
    else {
      img.src = "assets/family/" + pid + ".jpg";
      img.onload = function () { img.style.display = "block"; pic.querySelector("span").style.display = "none"; };
      img.onerror = function () { img.remove(); };
    }
    t.appendChild(el("div", "pname", p.name));
    var bits = [];
    if (p.birthday) bits.push(p.birthday);
    if (p.phone) bits.push(p.phone);
    if (p.email) bits.push('<a href="mailto:' + p.email + '">' + p.email + "</a>");
    if (p.addr1) bits.push(p.addr1);
    if (p.addr2) bits.push(p.addr2);
    t.appendChild(el("div", "pinfo", bits.join("<br>")));

    var mb = el("button", "pmenu-btn", "⋯");
    var menu = el("div", "pmenu");
    var edt = el("button", "", "Edit info");
    var addP = el("button", "", "Add partner");
    var addC = el("button", "", "Add child");
    var rep = el("button", "", "Replace photo");
    var rem = el("button", "", "Remove photo");
    menu.appendChild(edt); menu.appendChild(addP); menu.appendChild(addC);
    menu.appendChild(rep); menu.appendChild(rem);
    edt.addEventListener("click", function (e) {
      e.stopPropagation(); menu.classList.remove("open");
      openEditor(t, pid);
    });
    addP.addEventListener("click", function (e) {
      e.stopPropagation(); menu.classList.remove("open");
      openAddForm(t, pid, "partner");
    });
    addC.addEventListener("click", function (e) {
      e.stopPropagation(); menu.classList.remove("open");
      openAddForm(t, pid, "child");
    });
    if (pid.indexOf("x-") === 0) {
      var del = el("button", "", "Remove person");
      menu.appendChild(del);
      del.addEventListener("click", async function (e) {
        e.stopPropagation(); menu.classList.remove("open");
        if (!confirm("Remove " + p.name + " from the tree?")) return;
        try {
          var r = await fetch("/api/familytree/additions/" + pid, {
            method: "DELETE", headers: { "X-FT-Pass": currentPass } });
          if (!r.ok) throw new Error();
          delete additions[pid];
          buildUnits();
          render();
        } catch (_) { alert("Couldn't remove — try again."); }
      });
    }
    t.appendChild(mb); t.appendChild(menu);
    mb.addEventListener("click", function (e) {
      e.stopPropagation();
      document.querySelectorAll(".pmenu.open").forEach(function (m) { m.classList.remove("open"); });
      menu.classList.add("open");
    });
    rep.addEventListener("click", function (e) {
      e.stopPropagation(); menu.classList.remove("open");
      var picker = document.getElementById("photopick");
      picker.onchange = function () {
        var f = picker.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          try { localStorage.setItem("ftphoto:" + pid, r.result); } catch (_) {}
          var im = pic.querySelector("img") || pic.appendChild(el("img"));
          im.src = r.result; im.style.display = "block";
          pic.querySelector("span").style.display = "none";
        };
        r.readAsDataURL(f);
        picker.value = "";
      };
      picker.click();
    });
    rem.addEventListener("click", function (e) {
      e.stopPropagation(); menu.classList.remove("open");
      localStorage.setItem("ftphoto:" + pid, "hidden");
      var im = pic.querySelector("img");
      if (im) im.style.display = "none";
      pic.querySelector("span").style.display = "";
    });
    return t;
  }

  document.addEventListener("click", function () {
    document.querySelectorAll(".pmenu.open").forEach(function (m) { m.classList.remove("open"); });
  });

  /* ---------- add partner / child ---------- */
  function openAddForm(tile, anchorPid, role) {
    var old = tile.querySelector(".pinfo");
    var existing = tile.querySelector(".pedit");
    if (existing) existing.remove();
    var form = el("div", "pedit");
    form.appendChild(el("div", "pedit-msg",
      (role === "partner" ? "Adding partner of " : "Adding child of ") +
      data.people[anchorPid].name));
    var name = el("input"); name.placeholder = "full name (required)";
    var bday = el("input"); bday.placeholder = "birthday (optional)";
    var who = el("input"); who.placeholder = "your name (shown as editor)";
    who.value = localStorage.getItem("ftname") || "";
    form.appendChild(name); form.appendChild(bday); form.appendChild(who);
    var msg = el("div", "pedit-msg", "");
    var save = el("button", "pedit-save", "Add");
    var cancel = el("button", "pedit-cancel", "Cancel");
    form.appendChild(save); form.appendChild(cancel); form.appendChild(msg);
    old.style.display = "none";
    old.after(form);
    cancel.addEventListener("click", function () {
      form.remove(); old.style.display = "";
    });
    save.addEventListener("click", async function () {
      if (!name.value.trim()) { msg.textContent = "name is required"; return; }
      if (!who.value.trim()) { msg.textContent = "add your name"; return; }
      try { localStorage.setItem("ftname", who.value.trim()); } catch (_) {}
      msg.textContent = "adding…";
      try {
        var r = await fetch("/api/familytree/additions", {
          method: "POST",
          headers: { "X-FT-Pass": currentPass,
                     "Content-Type": "application/json" },
          body: JSON.stringify({ name: name.value.trim(), role: role,
            anchor: anchorPid, birthday: bday.value.trim(),
            editor: who.value.trim() }),
        });
        var res = await r.json();
        if (!r.ok || !res.ok) throw new Error();
        additions[res.pid] = res.person;
        data.people[res.pid] = { id: res.pid, name: res.person.name,
          birthday: res.person.birthday || "" };
        buildUnits();
        Object.keys(units).forEach(function (uid) {   // reveal the new person
          if (units[uid].kids.some(function (k) {
            return units[k] && units[k].tiles.indexOf(res.pid) !== -1;
          })) expanded[uid] = true;
        });
        render();
      } catch (_) { msg.textContent = "couldn't add — try again"; }
    });
  }

  /* ---------- inline contact editor ---------- */
  function openEditor(tile, pid) {
    var p = data.people[pid];
    var old = tile.querySelector(".pinfo");
    var form = el("div", "pedit");
    var labels = { birthday: "birthday", phone: "phone", email: "email",
                   addr1: "street", addr2: "city, st zip" };
    var inputs = {};
    EDIT_FIELDS.forEach(function (f) {
      var inp = el("input");
      inp.placeholder = labels[f];
      inp.value = p[f] || "";
      inputs[f] = inp;
      form.appendChild(inp);
    });
    var who = el("input");
    who.placeholder = "your name (shown as editor)";
    who.value = localStorage.getItem("ftname") || "";
    form.appendChild(who);
    var msg = el("div", "pedit-msg", "");
    var save = el("button", "pedit-save", "Save");
    var cancel = el("button", "pedit-cancel", "Cancel");
    form.appendChild(save); form.appendChild(cancel); form.appendChild(msg);
    old.style.display = "none";
    old.after(form);

    cancel.addEventListener("click", function () {
      form.remove(); old.style.display = "";
    });
    save.addEventListener("click", async function () {
      if (!who.value.trim()) { msg.textContent = "add your name"; return; }
      try { localStorage.setItem("ftname", who.value.trim()); } catch (_) {}
      var body = { editor: who.value.trim() };
      EDIT_FIELDS.forEach(function (f) { body[f] = inputs[f].value.trim(); });
      msg.textContent = "saving…";
      try {
        var r = await fetch("/api/familytree/person/" + pid, {
          method: "PUT",
          headers: { "X-FT-Pass": currentPass,
                     "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        EDIT_FIELDS.forEach(function (f) { p[f] = body[f]; });
        render();
      } catch (e) {
        msg.textContent = "couldn't save — try again";
      }
    });
  }

  /* ---------- unit model: expandable couples per generation ---------- */
  var units = {}, expanded = {}, additions = {};

  function firstName(pid) {
    var p = data.people[pid];
    return p ? p.name.split(/\s+/)[0] : "";
  }

  function buildUnits() {
    units = {};
    data.people["jack-root"] = { id: "jack-root", name: data.root.name +
      (data.root.nickname ? " “" + data.root.nickname + "”" : "") };
    var rootKids = [];
    data.branches.forEach(function (b) {
      var bid = "b:" + b.label;
      // blood member (name closest to branch label) leads the couple
      var couple = b.couple.slice().sort(function (x, y) {
        function score(pid) {
          var n = (data.people[pid] || {}).name || "";
          return b.label.split(/\s+/).filter(function (t) {
            return n.indexOf(t) !== -1;
          }).length;
        }
        return score(y) - score(x);
      });
      var kids = [];
      b.households.forEach(function (hh) {
        units[hh.id] = { id: hh.id, tiles: hh.members,
                         kids: hh.kids.map(leafUnit) };
      kids.push(hh.id);
      });
      (b.unplaced || []).forEach(function (pid) { kids.push(leafUnit(pid)); });
      units[bid] = { id: bid, tiles: couple, kids: kids, label: b.label };
      rootKids.push(bid);
    });
    units.root = { id: "root", tiles: ["jack-root"], kids: rootKids };

    // graft online additions (partners join a unit, children hang below it)
    var pids = Object.keys(additions).sort(function (a, b) {
      return (additions[a].createdAt || "").localeCompare(
              additions[b].createdAt || "");
    });
    pids.forEach(function (pid) {
      var a = additions[pid];
      var host = null;
      Object.keys(units).some(function (uid) {
        if (units[uid].tiles.indexOf(a.anchor) !== -1) {
          host = units[uid];
          return true;
        }
        return false;
      });
      if (!host || host.id === "root") return;
      if (a.role === "partner") {
        if (host.tiles.indexOf(pid) === -1) host.tiles.push(pid);
      } else {
        if (host.id.indexOf("b:") === 0) {
          // child of a 2nd-gen couple: becomes its own little household
          var hid = "ah-" + pid;
          units[hid] = { id: hid, tiles: [pid], kids: [] };
          host.kids.push(hid);
        } else {
          host.kids.push(leafUnit(pid));
        }
      }
    });
  }

  function leafUnit(pid) {
    var id = "p:" + pid;
    units[id] = { id: id, tiles: [pid], kids: [] };
    return id;
  }

  function unitName(u) {
    return u.label || firstName(u.tiles[0]) +
      (u.tiles[1] ? " & " + firstName(u.tiles[1]) : "");
  }

  function unitEl(u) {
    var box = el("div", "unit" + (u.kids.length ? " expandable" : "") +
                        (expanded[u.id] ? " open" : ""));
    box.dataset.uid = u.id;
    u.tiles.forEach(function (pid) { box.appendChild(personTile(pid)); });
    if (u.kids.length) {
      var n = u.kids.reduce(function (s, kid) {
        return s + units[kid].tiles.length;
      }, 0);
      box.appendChild(el("span", "expander",
        expanded[u.id] ? "− collapse" : "+ " + n));
      // expand/collapse fires from the viewport's tap detection (pointer
      // capture would swallow a click handler here)
    }
    return box;
  }

  var GEN_LABELS = ["", "1st generation", "2nd generation",
                    "3rd generation", "4th generation",
                    "5th generation", "6th generation"];

  function render() {
    var canvas = document.getElementById("canvas");
    canvas.innerHTML = "";

    var TILE_W = 168, TILE_GAP = 8, PAD = 8, ROW_H = 340, H_GAP = 64, M = 60;

    function unitWidth(u) {
      var n = u.tiles.length;
      return n * TILE_W + (n - 1) * TILE_GAP + PAD * 2 + 2;
    }

    // tidy tree: a unit is centred over its children; siblings shift as
    // neighbouring subtrees expand
    var maxDepth = 0;
    function measure(uid, depth) {
      var u = units[uid];
      if (depth > maxDepth) maxDepth = depth;
      var node = { uid: uid, depth: depth, unitW: unitWidth(u), children: [] };
      if (expanded[uid] && u.kids.length) {
        node.children = u.kids.map(function (k) { return measure(k, depth + 1); });
        node.childrenW = node.children.reduce(function (s, c) { return s + c.w; }, 0) +
                         H_GAP * (node.children.length - 1);
        node.w = Math.max(node.unitW, node.childrenW);
      } else {
        node.w = node.unitW;
      }
      return node;
    }
    var flat = [];
    function place(node, x) {
      flat.push(node);
      if (node.children.length) {
        var cx = x + (node.w - node.childrenW) / 2;
        node.children.forEach(function (c) {
          c.parentNode = node;
          place(c, cx);
          cx += c.w + H_GAP;
        });
        // centre the parent over its actual children (tidy-tree rule)
        var first = node.children[0], last = node.children[node.children.length - 1];
        var mid = (first.centerX + last.centerX) / 2;
        node.centerX = mid;
        node.unitX = mid - node.unitW / 2;
      } else {
        node.centerX = x + node.w / 2;
        node.unitX = node.centerX - node.unitW / 2;
      }
    }
    var tree = measure("root", 0);
    place(tree, M);
    canvas.style.width = (tree.w + M * 2) + "px";
    canvas.style.height = ((maxDepth + 1) * ROW_H + M * 2) + "px";

    var boxes = {};
    flat.forEach(function (node) {
      var b = unitEl(units[node.uid]);
      b.style.left = node.unitX + "px";
      b.style.top = (M + node.depth * ROW_H) + "px";
      canvas.appendChild(b);
      boxes[node.uid] = b;
    });

    for (var d = 0; d <= maxDepth; d++) {
      var tag = el("div", "rowtag", GEN_LABELS[d + 1] || "");
      tag.style.top = (M + d * ROW_H) + "px";
      canvas.appendChild(tag);
    }

    // elbow connectors parent -> child, using real rendered heights
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.id = "wires";
    svg.setAttribute("width", parseFloat(canvas.style.width));
    svg.setAttribute("height", parseFloat(canvas.style.height));
    var dPath = "";
    flat.forEach(function (node) {
      if (!node.parentNode) return;
      var pb = boxes[node.parentNode.uid], cb = boxes[node.uid];
      var px = pb.offsetLeft + pb.offsetWidth / 2;
      var py = pb.offsetTop + pb.offsetHeight;
      var cx2 = cb.offsetLeft + cb.offsetWidth / 2;
      var cy = cb.offsetTop;
      var my = (py + cy) / 2;
      dPath += "M" + px + " " + py + " L" + px + " " + my +
               " L" + cx2 + " " + my + " L" + cx2 + " " + cy + " ";
    });
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", dPath);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke-width", "1.5");
    path.style.stroke = "var(--line)";
    svg.appendChild(path);
    canvas.insertBefore(svg, canvas.firstChild);
  }

  /* ---------- pan & zoom ---------- */
  var scale = 1, tx = 0, ty = 0;
  var viewport = document.getElementById("viewport");
  var canvas = document.getElementById("canvas");

  function apply() {
    canvas.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
  }
  function fit() {
    var vw = viewport.clientWidth, cw = canvas.scrollWidth;
    if (vw < 100 || cw < 100) {          // layout not settled yet
      requestAnimationFrame(fit);
      return;
    }
    scale = Math.max(0.12, Math.min(1, (vw - 40) / cw));
    tx = 20; ty = 20;
    apply();
  }
  function zoomAt(cx, cy, factor) {
    var ns = Math.max(0.15, Math.min(3, scale * factor));
    tx = cx - (cx - tx) * (ns / scale);
    ty = cy - (cy - ty) * (ns / scale);
    scale = ns;
    apply();
  }

  viewport.addEventListener("wheel", function (e) {
    // only intercept pinch-zoom (ctrl+wheel); a plain two-finger scroll
    // falls through so the page scrolls like any normal site
    if (!e.ctrlKey) return;
    e.preventDefault();
    var r = viewport.getBoundingClientRect();
    var lines = e.deltaMode === 1 ? 16 : 1;
    var f = Math.max(0.85, Math.min(1.18, Math.exp(-e.deltaY * lines * 0.01)));
    zoomAt(e.clientX - r.left, e.clientY - r.top, f);
  }, { passive: false });

  document.getElementById("zin").addEventListener("click", function () {
    zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25);
  });
  document.getElementById("zout").addEventListener("click", function () {
    zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 0.8);
  });
  document.getElementById("zfit").addEventListener("click", fit);

  var pointers = new Map(), lastDist = 0, panning = null;
  var downTarget = null, movedTotal = 0;
  viewport.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".pmenu, .pmenu-btn, .zoombar, a, .pedit, input, button")) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      panning = { x: e.clientX, y: e.clientY };
      downTarget = e.target;
      movedTotal = 0;
      viewport.classList.add("grabbing");
      viewport.setPointerCapture(e.pointerId);
    }
  });
  viewport.addEventListener("pointermove", function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var pts = Array.from(pointers.values());
    if (pts.length === 2) {
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (lastDist) {
        var r = viewport.getBoundingClientRect();
        zoomAt((pts[0].x + pts[1].x) / 2 - r.left,
               (pts[0].y + pts[1].y) / 2 - r.top, d / lastDist);
      }
      lastDist = d;
    } else if (panning) {
      movedTotal += Math.abs(e.clientX - panning.x) +
                    Math.abs(e.clientY - panning.y);
      tx += e.clientX - panning.x;
      ty += e.clientY - panning.y;
      panning = { x: e.clientX, y: e.clientY };
      apply();
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) lastDist = 0;
    if (pointers.size === 0) {
      // pointer capture routes clicks to the viewport, so expand taps
      // are detected here: a press that barely moved on an expandable unit
      if (e.type === "pointerup" && movedTotal < 8 && downTarget) {
        var unit = downTarget.closest(".unit.expandable");
        if (unit && !downTarget.closest("a, .pmenu, .pmenu-btn, .pedit, input, button")) {
          expanded[unit.dataset.uid] = !expanded[unit.dataset.uid];
          render();
        }
      }
      panning = null;
      downTarget = null;
      viewport.classList.remove("grabbing");
    }
  }
  viewport.addEventListener("pointerup", endPointer);
  viewport.addEventListener("pointercancel", endPointer);
})();
</script>

</body>
</html>
